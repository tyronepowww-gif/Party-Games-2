<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  />
  <meta name="theme-color" content="#11132a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thumb Arena" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <title>Thumb Arena</title>

  <style>
    :root {
      --bg: #11132a;
      --bg-deep: #090a19;
      --panel: rgba(40, 43, 82, 0.94);
      --panel-soft: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8f9ff;
      --muted: #b8bedf;
      --cyan: #56e4ff;
      --pink: #ff6b94;
      --green: #8fff6b;
      --gold: #ffd35b;
      --purple: #ab7dff;
      --danger: #ff5c75;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: #070813;
      color: var(--text);
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(86, 228, 255, 0.16), transparent 28%),
        radial-gradient(circle at 92% 22%, rgba(171, 125, 255, 0.18), transparent 30%),
        linear-gradient(155deg, var(--bg), #211947);
    }

    #app::before,
    #app::after {
      position: absolute;
      z-index: 0;
      width: 180px;
      height: 180px;
      content: "";
      border-radius: 50%;
      opacity: 0.16;
      filter: blur(3px);
      pointer-events: none;
      animation: float 10s ease-in-out infinite;
    }

    #app::before {
      top: -75px;
      left: -80px;
      background: var(--cyan);
    }

    #app::after {
      right: -85px;
      bottom: -85px;
      background: var(--purple);
      animation-delay: -4s;
    }

    @keyframes float {
      50% {
        transform: translate(20px, 18px) scale(1.1);
      }
    }

    .screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--safe-top) 18px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: enter 0.24s ease both;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h1,
    .topbar h2,
    .topbar p {
      margin: 0;
    }

    .topbar h2 {
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .topbar p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .brand {
      margin: 0;
      font-size: clamp(2.6rem, 14vw, 4.7rem);
      line-height: 0.86;
      letter-spacing: -0.09em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    .brand span {
      color: var(--cyan);
    }

    .tagline {
      margin: 14px auto 28px;
      color: var(--muted);
    }

    .console-box {
      display: flex;
      width: min(360px, 100%);
      min-height: 310px;
      padding: 30px 22px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 35px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03)),
        #565a76;
      box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.18), var(--shadow);
    }

    .disc {
      display: grid;
      width: 133px;
      height: 133px;
      margin-bottom: 25px;
      place-items: center;
      border: 10px solid #272a43;
      border-radius: 50%;
      color: #16172b;
      font-size: 2rem;
      background:
        radial-gradient(circle at center, #20233d 0 14%, transparent 15%),
        repeating-conic-gradient(
          #ff6388 0deg 36deg,
          #ffd35b 36deg 72deg,
          #56e4ff 72deg 108deg,
          #9b7bff 108deg 144deg,
          #8fff6b 144deg 180deg
        );
      box-shadow: 0 13px 22px rgba(0, 0, 0, 0.33), inset 0 0 0 2px rgba(255, 255, 255, 0.45);
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border-radius: 18px;
      color: #15162d;
      font-weight: 950;
      letter-spacing: 0.04em;
      background: var(--cyan);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22), 0 12px 22px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(4px);
      filter: brightness(0.92);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .btn.secondary {
      color: #242642;
      background: #eff1ff;
    }

    .btn.dark {
      color: var(--text);
      background: #353962;
    }

    .btn.warn {
      color: #35101a;
      background: var(--danger);
    }

    .btn.green {
      color: #102613;
      background: var(--green);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-row .btn {
      flex: 1;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.18rem;
      background: var(--panel);
    }

    .menu-grid,
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .menu-card,
    .game-card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .menu-card,
    .game-card {
      min-height: 174px;
      padding: 16px;
      text-align: left;
    }

    .menu-card:active,
    .game-card:active {
      transform: scale(0.98);
    }

    .menu-card.wide {
      grid-column: 1 / -1;
      min-height: 132px;
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 19px;
      color: #17182d;
      font-size: 1.65rem;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.4);
    }

    .menu-card h3,
    .game-card h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      line-height: 1.02;
    }

    .menu-card p,
    .game-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.28;
    }

    .badge {
      display: inline-block;
      margin-top: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #18192d;
      font-size: 0.65rem;
      font-weight: 900;
      background: #eff1ff;
    }

    .badge.green {
      background: var(--green);
    }

    .badge.gold {
      background: var(--gold);
    }

    .badge.dim {
      color: #d3d7f2;
      background: #4d5179;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 1.08rem;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.42;
      font-size: 0.9rem;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 56px;
      padding: 11px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 16px;
      background: var(--panel-soft);
    }

    .row strong,
    .row small {
      display: block;
    }

    .row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .slot-dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      background: transparent;
    }

    .slot-dot.connected {
      background: var(--green);
      box-shadow: 0 0 14px rgba(143, 255, 107, 0.8);
    }

    .slot-name {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .input,
    .textarea {
      width: 100%;
      min-height: 50px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #25294b;
      user-select: text;
      -webkit-user-select: text;
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
    }

    .field-label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 0.77rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .player-options {
      display: flex;
      gap: 8px;
      margin: 9px 0 15px;
    }

    .number-btn {
      display: grid;
      width: 52px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: var(--text);
      font-weight: 950;
      background: #3b406b;
    }

    .number-btn.active {
      color: #15223b;
      background: var(--cyan);
    }

    .qr-box {
      display: grid;
      width: min(290px, 100%);
      aspect-ratio: 1;
      margin: 12px auto 18px;
      place-items: center;
      overflow: hidden;
      border: 12px solid #f7f8ff;
      border-radius: 18px;
      background: #f7f8ff;
    }

    .qr-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(var(--qr-size), 1fr);
      grid-template-rows: repeat(var(--qr-size), 1fr);
      background: #fff;
    }

    .qr-cell {
      background: #fff;
    }

    .qr-cell.dark {
      background: #121326;
    }

    .code-box {
      margin: 10px 0 17px;
      padding: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 15px;
      color: var(--gold);
      font-size: 1.7rem;
      font-weight: 1000;
      letter-spacing: 0.15em;
      text-align: center;
      background: rgba(0, 0, 0, 0.17);
    }

    .notice {
      margin: 14px 0;
      padding: 12px 13px;
      border: 1px solid rgba(255, 211, 91, 0.35);
      border-radius: 15px;
      color: #fff0bd;
      font-size: 0.82rem;
      line-height: 1.42;
      background: rgba(255, 211, 91, 0.1);
    }

    .notice.info {
      border-color: rgba(86, 228, 255, 0.32);
      color: #c8f8ff;
      background: rgba(86, 228, 255, 0.09);
    }

    .game-screen {
      overflow: hidden;
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .hud {
      display: flex;
      min-height: 58px;
      padding: 0 4px 8px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      max-width: calc(100vw - 100px);
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-area {
      position: relative;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      touch-action: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.1) 0 2px, transparent 3px),
        linear-gradient(155deg, #2d3261, #15172e);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.3);
    }

    .arena-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .game-overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      text-align: center;
      background: rgba(10, 11, 29, 0.74);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      width: min(365px, 100%);
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(145deg, #3d4277, #24284e);
      box-shadow: var(--shadow);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    .overlay-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    .touchpad {
      position: relative;
      display: grid;
      min-height: 58vh;
      margin: 12px 0;
      overflow: hidden;
      place-items: center;
      border: 2px solid rgba(86, 228, 255, 0.4);
      border-radius: 30px;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(86, 228, 255, 0.19), transparent 28%),
        linear-gradient(145deg, #242a55, #15172c);
      box-shadow: inset 0 0 40px rgba(86, 228, 255, 0.1);
    }

    .touchpad::before,
    .touchpad::after {
      position: absolute;
      width: 1px;
      height: 100%;
      content: "";
      background: rgba(255, 255, 255, 0.09);
    }

    .touchpad::before {
      transform: rotate(90deg);
    }

    .touchpad-label {
      z-index: 1;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
      font-weight: 1000;
      pointer-events: none;
    }

    .touch-indicator {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 4px solid var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(86, 228, 255, 0.75);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .result-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-card {
      width: min(430px, 100%);
      padding: 25px 18px;
      border: 1px solid var(--line);
      border-radius: 29px;
      background: linear-gradient(145deg, #3c4173, #24274b);
      box-shadow: var(--shadow);
    }

    .result-card h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.06em;
    }

    .result-card > p {
      margin: 8px 0 17px;
      color: var(--muted);
    }

    .rankings {
      display: grid;
      gap: 8px;
      margin: 15px 0 18px;
      text-align: left;
    }

    .rank {
      display: flex;
      min-height: 50px;
      padding: 10px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
    }

    .rank:first-child {
      border: 1px solid rgba(255, 211, 91, 0.54);
      background: rgba(255, 211, 91, 0.18);
    }

    .rank span:last-child {
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 850;
      text-align: right;
    }

    .modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 16, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #2b3058;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin: 0 0 8px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    #toast {
      position: absolute;
      z-index: 80;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #17182d;
      font-size: 0.84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%, 130px);
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #rotate {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      padding: 28px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #11132a;
    }

    #rotate strong {
      display: block;
      margin-bottom: 18px;
      font-size: 4rem;
      transform: rotate(90deg);
    }

    #rotate h2 {
      margin: 0 0 8px;
    }

    #rotate p {
      margin: 0;
      color: var(--muted);
    }

    @media (orientation: landscape) and (max-height: 650px) {
      #rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="rotate">
    <div>
      <strong>▯</strong>
      <h2>Rotate your device</h2>
      <p>Thumb Arena works best in portrait orientation.</p>
    </div>
  </div>

  <script>
    "use strict";

    /*
      Thumb Arena Offline-First Foundation

      Important honesty note:
      - Solo and same-device pass-and-play are fully offline.
      - Manual WebRTC pairing can be prepared without a server.
      - Actual multi-phone connection reliability depends on browser and
        nearby-network support. QR transfers pairing data only; it does not
        itself create a radio/network connection.
    */

    const APP_VERSION = "1.0.0";
    const PARTY_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    const PLAYER_COLORS = ["#56e4ff", "#ff6b94", "#8fff6b", "#ffd35b"];

    const GAME_LIBRARY = [
      {
        id: "dodgeStorm",
        title: "Dodge Storm",
        icon: "☄",
        color: "#56e4ff",
        mode: "SOLO",
        description: "Drag your orb. Survive incoming hazards."
      },
      {
        id: "controllerArena",
        title: "Controller Test Arena",
        icon: "◉",
        color: "#8fff6b",
        mode: "OFFLINE CONTROLLER READY",
        description: "A local touch-control arena proof of concept."
      },
      {
        id: "trailDuel",
        title: "Trail Duel",
        icon: "〰",
        color: "#ab7dff",
        mode: "PASS-AND-PLAY",
        description: "Leave a trail. Do not crash."
      },
      {
        id: "targetRush",
        title: "Target Rush",
        icon: "◎",
        color: "#ffd35b",
        mode: "PASS-AND-PLAY",
        description: "Tap targets before they vanish."
      }
    ];

    class StorageManager {
      constructor() {
        this.key = "thumbArenaOfflineV1";
        this.memoryOnly = false;
        this.data = this.load();
      }

      defaults() {
        return {
          settings: {
            sound: true,
            vibration: true,
            reducedEffects: false
          },
          stats: {
            gamesPlayed: 0,
            wins: 0,
            longestSurvival: 0,
            controllerArenaHigh: 0
          }
        };
      }

      load() {
        const defaults = this.defaults();
        try {
          const value = localStorage.getItem(this.key);
          if (!value) return defaults;
          const saved = JSON.parse(value);
          return {
            ...defaults,
            ...saved,
            settings: { ...defaults.settings, ...(saved.settings || {}) },
            stats: { ...defaults.stats, ...(saved.stats || {}) }
          };
        } catch {
          this.memoryOnly = true;
          return defaults;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.data));
        } catch {
          this.memoryOnly = true;
        }
      }

      setSetting(name, value) {
        this.data.settings[name] = value;
        this.save();
      }

      gamePlayed() {
        this.data.stats.gamesPlayed += 1;
        this.save();
      }

      win() {
        this.data.stats.wins += 1;
        this.save();
      }

      dodgeRecord(seconds) {
        this.data.stats.longestSurvival = Math.max(this.data.stats.longestSurvival, seconds);
        this.save();
      }

      controllerRecord(score) {
        this.data.stats.controllerArenaHigh = Math.max(this.data.stats.controllerArenaHigh, score);
        this.save();
      }

      reset() {
        const settings = { ...this.data.settings };
        this.data = this.defaults();
        this.data.settings = settings;
        this.save();
      }
    }

    class AudioManager {
      constructor(storage) {
        this.storage = storage;
        this.context = null;
      }

      play(type = "click") {
        if (!this.storage.data.settings.sound) return;

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!this.context) this.context = new AudioContextClass();
          if (this.context.state === "suspended") this.context.resume();

          const soundMap = {
            click: [460, 0.05, "sine"],
            start: [700, 0.1, "sine"],
            hit: [125, 0.16, "sawtooth"],
            win: [900, 0.16, "triangle"],
            point: [760, 0.06, "square"]
          };

          const [frequency, duration, waveform] = soundMap[type] || soundMap.click;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();

          oscillator.type = waveform;
          oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);

          gain.gain.setValueAtTime(0.08, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.context.currentTime + duration);

          oscillator.connect(gain).connect(this.context.destination);
          oscillator.start();
          oscillator.stop(this.context.currentTime + duration);
        } catch {}
      }

      vibrate(pattern = 15) {
        if (!this.storage.data.settings.vibration) return;
        try {
          if ("vibrate" in navigator) navigator.vibrate(pattern);
        } catch {}
      }
    }

    class InputManager {
      constructor() {
        this.active = false;
        this.pointerId = null;
        this.x = 0.5;
        this.y = 0.5;
        this.startX = 0.5;
        this.startY = 0.5;
        this.dx = 0;
        this.dy = 0;
        this.tap = false;
        this.released = false;
        this.changed = false;
        this.lastSentAt = 0;
      }

      attach(element, callbacks = {}) {
        const point = (event) => {
          const rect = element.getBoundingClientRect();
          return {
            x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
            y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
          };
        };

        const down = (event) => {
          event.preventDefault();
          const p = point(event);
          this.active = true;
          this.pointerId = event.pointerId;
          this.x = this.startX = p.x;
          this.y = this.startY = p.y;
          this.dx = 0;
          this.dy = 0;
          this.tap = false;
          this.released = false;
          this.changed = true;
          element.setPointerCapture?.(event.pointerId);
          callbacks.down?.(this.snapshot());
        };

        const move = (event) => {
          if (!this.active || event.pointerId !== this.pointerId) return;
          event.preventDefault();
          const p = point(event);
          this.dx = p.x - this.x;
          this.dy = p.y - this.y;
          this.x = p.x;
          this.y = p.y;
          this.changed = true;
          callbacks.move?.(this.snapshot());
        };

        const up = (event) => {
          if (!this.active || event.pointerId !== this.pointerId) return;
          event.preventDefault();
          const p = point(event);
          const movement = Math.hypot(p.x - this.startX, p.y - this.startY);
          this.tap = movement < 0.035;
          this.x = p.x;
          this.y = p.y;
          this.active = false;
          this.released = true;
          this.changed = true;
          callbacks.up?.(this.snapshot());
        };

        element.addEventListener("pointerdown", down, { passive: false });
        element.addEventListener("pointermove", move, { passive: false });
        element.addEventListener("pointerup", up, { passive: false });
        element.addEventListener("pointercancel", up, { passive: false });

        return () => {
          element.removeEventListener("pointerdown", down);
          element.removeEventListener("pointermove", move);
          element.removeEventListener("pointerup", up);
          element.removeEventListener("pointercancel", up);
        };
      }

      snapshot() {
        return {
          pressed: this.active,
          x: this.x,
          y: this.y,
          dx: this.dx,
          dy: this.dy,
          tap: this.tap,
          released: this.released
        };
      }
    }

    class NetworkManager {
      constructor(ui) {
        this.ui = ui;
        this.party = null;
        this.peerConnections = new Map();
        this.dataChannels = new Map();
        this.supported = "RTCPeerConnection" in window;
      }

      secureBytes(length = 16) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);
        return bytes;
      }

      base64url(bytes) {
        let binary = "";
        bytes.forEach(byte => binary += String.fromCharCode(byte));
        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      randomId(bytes = 16) {
        return this.base64url(this.secureBytes(bytes));
      }

      partyCode(length = 6) {
        const random = this.secureBytes(length);
        return Array.from(random, byte => PARTY_ALPHABET[byte % PARTY_ALPHABET.length]).join("");
      }

      createOfflineParty(limit = 4) {
        this.endParty();

        this.party = {
          id: this.randomId(16),
          code: this.partyCode(6),
          hostSecret: this.randomId(16),
          limit,
          createdAt: Date.now(),
          expiresAt: Date.now() + 5 * 60 * 1000,
          players: [
            {
              id: this.randomId(10),
              slot: 1,
              name: "Host",
              color: PLAYER_COLORS[0],
              host: true,
              connected: true,
              ready: true
            }
          ],
          pairing: null
        };

        return this.party;
      }

      createPairingOffer(slot, hostName = "Host") {
        if (!this.party) throw new Error("No active party.");

        const pairing = {
          version: 1,
          kind: "thumb-arena-offline-offer",
          pairingId: this.randomId(12),
          partyId: this.party.id,
          partyCode: this.party.code,
          slot,
          hostName,
          expiresAt: Date.now() + 5 * 60 * 1000,
          nonce: this.randomId(12),
          note: "Offline pairing information. QR transfers data only."
        };

        this.party.pairing = pairing;
        return pairing;
      }

      encodePairing(payload) {
        const json = JSON.stringify(payload);
        const utf8 = new TextEncoder().encode(json);
        return this.base64url(utf8);
      }

      decodePairing(value) {
        const normalized = value.trim()
          .replace(/^thumbarena:\/\//i, "")
          .replace(/^#?pair=/i, "")
          .replace(/\s/g, "");

        const padded = normalized
          .replace(/-/g, "+")
          .replace(/_/g, "/") + "===".slice((normalized.length + 3) % 4);

        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const text = new TextDecoder().decode(bytes);
        const payload = JSON.parse(text);

        if (!payload || payload.version !== 1) throw new Error("Unsupported pairing data.");
        if (payload.expiresAt && Date.now() > payload.expiresAt) throw new Error("This pairing code expired.");
        return payload;
      }

      /*
        This method prepares the WebRTC offer object. A full serverless connection
        requires the offer and returned answer to be exchanged manually. Because
        no STUN/TURN service is used, connectivity is intentionally not promised
        on all mobile browser/network combinations.
      */
      async createWebRTCOffer(pairingPayload) {
        if (!this.supported) {
          throw new Error("This browser does not support WebRTC.");
        }

        const pc = new RTCPeerConnection({ iceServers: [] });
        const channel = pc.createDataChannel("events", { ordered: true });

        this.setupChannel(channel, pairingPayload.pairingId);
        this.peerConnections.set(pairingPayload.pairingId, pc);

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await this.waitForIceComplete(pc, 1800);

        return {
          ...pairingPayload,
          webrtcOffer: pc.localDescription,
          kind: "thumb-arena-offline-webrtc-offer"
        };
      }

      async createWebRTCAnswer(offerPayload, playerName) {
        if (!this.supported) {
          throw new Error("This browser does not support WebRTC.");
        }

        if (!offerPayload.webrtcOffer) {
          throw new Error("This offer does not include WebRTC connection data.");
        }

        const pc = new RTCPeerConnection({ iceServers: [] });
        this.peerConnections.set(offerPayload.pairingId, pc);

        pc.ondatachannel = event => {
          this.setupChannel(event.channel, offerPayload.pairingId);
        };

        await pc.setRemoteDescription(offerPayload.webrtcOffer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await this.waitForIceComplete(pc, 1800);

        return {
          version: 1,
          kind: "thumb-arena-offline-webrtc-answer",
          pairingId: offerPayload.pairingId,
          partyId: offerPayload.partyId,
          partyCode: offerPayload.partyCode,
          slot: offerPayload.slot,
          playerName: (playerName || `Player ${offerPayload.slot}`).slice(0, 14),
          playerToken: this.randomId(10),
          expiresAt: offerPayload.expiresAt,
          webrtcAnswer: pc.localDescription
        };
      }

      async acceptWebRTCAnswer(answerPayload) {
        const pc = this.peerConnections.get(answerPayload.pairingId);
        if (!pc) throw new Error("No matching host pairing attempt was found.");
        if (!answerPayload.webrtcAnswer) throw new Error("Answer is missing WebRTC connection data.");
        await pc.setRemoteDescription(answerPayload.webrtcAnswer);
      }

      waitForIceComplete(pc, maxWait = 1800) {
        return new Promise(resolve => {
          if (pc.iceGatheringState === "complete") return resolve();
          const timeout = setTimeout(done, maxWait);

          function done() {
            clearTimeout(timeout);
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }

          function check() {
            if (pc.iceGatheringState === "complete") done();
          }

          pc.addEventListener("icegatheringstatechange", check);
        });
      }

      setupChannel(channel, pairingId) {
        this.dataChannels.set(pairingId, channel);

        channel.onopen = () => {
          this.ui?.toast("Offline controller channel connected.");
        };

        channel.onmessage = event => {
          try {
            const message = JSON.parse(event.data);
            this.handleMessage(message, pairingId);
          } catch {}
        };

        channel.onclose = () => {
          this.ui?.toast("Controller connection closed.");
        };

        channel.onerror = () => {
          this.ui?.toast("Controller connection error.");
        };
      }

      handleMessage(message) {
        if (!message || typeof message.type !== "string") return;

        if (message.type === "input") {
          const x = Number(message.x);
          const y = Number(message.y);
          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          /* Game-specific host input routing belongs here as games are adapted. */
        }
      }

      endParty() {
        this.dataChannels.forEach(channel => {
          try { channel.close(); } catch {}
        });

        this.peerConnections.forEach(pc => {
          try { pc.close(); } catch {}
        });

        this.dataChannels.clear();
        this.peerConnections.clear();
        this.party = null;
      }
    }

          confirmAction?.();

      fakeQR(data) {
        /*
          This renders a deterministic visual pairing grid for the local prototype.
          Replace this with a fully standards-compliant bundled QR encoder before
          relying on camera scanning in production. Copy/paste pairing remains
          functional regardless of QR scanner support.
        */
        const size = 29;
        let seed = 2166136261;

        for (let i = 0; i < data.length; i++) {
          seed ^= data.charCodeAt(i);
          seed = Math.imul(seed, 16777619);
        }

        const random = () => {
          seed += 0x6d2b79f5;
          let value = seed;
          value = Math.imul(value ^ (value >>> 15), value | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };

        const finder = (x, y) => {
          const anchors = [[0, 0], [size - 7, 0], [0, size - 7]];
          return anchors.some(([ax, ay]) => {
            const dx = x - ax;
            const dy = y - ay;
            if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return false;
            return dx === 0 || dx === 6 || dy === 0 || dy === 6 ||
              (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
          });
        };

        let cells = "";
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const dark = finder(x, y) || (!(
              (x < 8 && y < 8) ||
              (x >= size - 8 && y < 8) ||
              (x < 8 && y >= size - 8)
            ) && random() > 0.52);
            cells += `<span class="qr-cell ${dark ? "dark" : ""}"></span>`;
          }
        }

        return `<div class="qr-grid" style="--qr-size:${size}" aria-label="Pairing data visual grid">${cells}</div>`;
      }

      async copyText(text) {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            return;
          }
        } catch {}

        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
    }

    class GameManager {
      constructor(storage, audio) {
        this.storage = storage;
        this.audio = audio;
        this.ui = null;
        this.cleanup = null;
      }

      stop() {
        if (typeof this.cleanup === "function") {
          this.cleanup();
          this.cleanup = null;
        }
      }

      startDodgeStorm() {
        this.stop();
        this.storage.gamePlayed();

        const area = this.ui.gameShell("Dodge Storm", "3…");
        const canvas = document.createElement("canvas");
        canvas.className = "arena-canvas";
        area.appendChild(canvas);

        const context = canvas.getContext("2d");
        const state = {
          running: false,
          startedAt: 0,
          player: { x: 0, y: 0, targetX: 0, targetY: 0, radius: 19 },
          hazards: [],
          lastSpawn: 0,
          frame: null,
          removeInput: null
        };

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (!state.player.x) {
            state.player.x = state.player.targetX = rect.width / 2;
            state.player.y = state.player.targetY = rect.height / 2;
          }
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();
          context.clearRect(0, 0, rect.width, rect.height);

          const gradient = context.createLinearGradient(0, 0, 0, rect.height);
          gradient.addColorStop(0, "#32386c");
          gradient.addColorStop(1, "#17192f");
          context.fillStyle = gradient;
          context.fillRect(0, 0, rect.width, rect.height);

          context.strokeStyle = "rgba(86,228,255,.11)";
          context.lineWidth = 1;
          for (let x = -rect.height; x < rect.width + rect.height; x += 28) {
            context.beginPath();
            context.moveTo(x, 0);
            context.lineTo(x + rect.height, rect.height);
            context.stroke();
          }

          state.hazards.forEach(hazard => {
            context.save();
            context.translate(hazard.x, hazard.y);
            context.rotate(hazard.rotation);
            context.fillStyle = "#ff6b94";
            context.shadowColor = "#ff6b94";
            context.shadowBlur = 15;
            context.fillRect(-hazard.size / 2, -hazard.size / 2, hazard.size, hazard.size);
            context.restore();
          });

          context.beginPath();
          context.arc(state.player.x, state.player.y, state.player.radius, 0, Math.PI * 2);
          context.fillStyle = "#56e4ff";
          context.shadowColor = "#56e4ff";
          context.shadowBlur = 20;
          context.fill();
          context.shadowBlur = 0;
          context.lineWidth = 4;
          context.strokeStyle = "#f1ffff";
          context.stroke();

          context.fillStyle = "#1d2440";
          context.font = "bold 14px system-ui";
          context.textAlign = "center";
          context.fillText("•ᴗ•", state.player.x, state.player.y + 5);
        };

        const end = () => {
          if (!state.running) return;
          state.running = false;
          const seconds = (performance.now() - state.startedAt) / 1000;
          this.storage.dodgeRecord(seconds);
          this.storage.win();
          this.audio.play("hit");
          this.audio.vibrate([40, 20, 60]);
          area.style.animation = "none";
          area.offsetHeight;
          area.style.animation = "shake .35s ease both";

          setTimeout(() => {
            this.stop();
            this.ui.results(
              "STORM GOT YOU",
              `You survived ${seconds.toFixed(1)} seconds.`,
              [{ name: "Player 1", score: `${seconds.toFixed(1)} seconds` }],
              () => this.startDodgeStorm()
            );
          }, 450);
        };

        const spawn = (level) => {
          const rect = area.getBoundingClientRect();
          const side = Math.floor(Math.random() * 4);
          const size = 20 + Math.random() * (15 + level * 2);
          let x = 0;
          let y = 0;

          if (side === 0) { x = -size; y = Math.random() * rect.height; }
          if (side === 1) { x = rect.width + size; y = Math.random() * rect.height; }
          if (side === 2) { x = Math.random() * rect.width; y = -size; }
          if (side === 3) { x = Math.random() * rect.width; y = rect.height + size; }

          const angle = Math.atan2(state.player.y - y, state.player.x - x);
          state.hazards.push({
            x,
            y,
            size,
            rotation: Math.random() * Math.PI,
            vx: Math.cos(angle) * (1.2 + level * 0.2 + Math.random() * 0.6),
            vy: Math.sin(angle) * (1.2 + level * 0.2 + Math.random() * 0.6)
          });
        };

        const input = new InputManager();
        state.removeInput = input.attach(area, {
          down: ({ x, y }) => {
            const rect = area.getBoundingClientRect();
            state.player.targetX = x * rect.width;
            state.player.targetY = y * rect.height;
          },
          move: ({ x, y }) => {
            const rect = area.getBoundingClientRect();
            state.player.targetX = x * rect.width;
            state.player.targetY = y * rect.height;
          }
        });

        const overlay = document.createElement("div");
        overlay.className = "game-overlay";
        overlay.innerHTML = `
          <div class="overlay-card">
            <div class="hud-label">Dodge Storm</div>
            <h2 id="count">3</h2>
            <p>Drag your glowing orb. Avoid every storm block.</p>
          </div>
        `;
        area.appendChild(overlay);

        let count = 3;
        const countdown = setInterval(() => {
          const countEl = overlay.querySelector("#count");
          count -= 1;

          if (count <= 0) {
            clearInterval(countdown);
            countEl.textContent = "GO!";
            this.audio.play("start");

            setTimeout(() => {
              overlay.remove();
              state.running = true;
              state.startedAt = performance.now();

              const loop = (now) => {
                if (!state.running) return;

                const rect = area.getBoundingClientRect();
                const elapsed = (now - state.startedAt) / 1000;
                const level = Math.floor(elapsed / 10) + 1;

                state.player.x += (state.player.targetX - state.player.x) * 0.17;
                state.player.y += (state.player.targetY - state.player.y) * 0.17;

                state.player.x = Math.max(state.player.radius, Math.min(rect.width - state.player.radius, state.player.x));
                state.player.y = Math.max(state.player.radius, Math.min(rect.height - state.player.radius, state.player.y));

                const spawnDelay = Math.max(280, 850 - level * 85);
                if (now - state.lastSpawn > spawnDelay) {
                  spawn(level);
                  state.lastSpawn = now;
                }

                for (let i = state.hazards.length - 1; i >= 0; i--) {
                  const h = state.hazards[i];
                  h.x += h.vx;
                  h.y += h.vy;
                  h.rotation += 0.035;

                  if (Math.hypot(h.x - state.player.x, h.y - state.player.y) < state.player.radius + h.size * 0.44) {
                    end();
                    return;
                  }

                  if (h.x < -100 || h.y < -100 || h.x > rect.width + 100 || h.y > rect.height + 100) {
                    state.hazards.splice(i, 1);
                  }
                }

                const hud = document.querySelector("#hudValue");
                if (hud) hud.textContent = `${elapsed.toFixed(1)}s • Level ${level}`;
                draw();
                state.frame = requestAnimationFrame(loop);
              };

              state.frame = requestAnimationFrame(loop);
            }, 450);
          } else {
            countEl.textContent = count;
            this.audio.play("click");
          }
        }, 700);

        resize();
        window.addEventListener("resize", resize);

        this.cleanup = () => {
          clearInterval(countdown);
          cancelAnimationFrame(state.frame);
          state.removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }

      startControllerArena() {
        this.stop();
        this.storage.gamePlayed();

        const area = this.ui.gameShell("Controller Test Arena", "Drag to collect");
        const canvas = document.createElement("canvas");
        canvas.className = "arena-canvas";
        area.appendChild(canvas);

        const context = canvas.getContext("2d");
        const state = {
          player: { x: 0, y: 0, tx: 0, ty: 0, radius: 22 },
          gem: { x: 0, y: 0, radius: 16 },
          score: 0,
          started: performance.now(),
          duration: 30000,
          frame: null,
          removeInput: null
        };

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (!state.player.x) {
            state.player.x = state.player.tx = rect.width / 2;
            state.player.y = state.player.ty = rect.height / 2;
            spawnGem();
          }
        };

        const spawnGem = () => {
          const rect = area.getBoundingClientRect();
          state.gem.x = 40 + Math.random() * Math.max(1, rect.width - 80);
          state.gem.y = 45 + Math.random() * Math.max(1, rect.height - 90);
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();
          context.clearRect(0, 0, rect.width, rect.height);

          context.fillStyle = "#161932";
          context.fillRect(0, 0, rect.width, rect.height);

          for (let y = 0; y < rect.height; y += 32) {
            context.strokeStyle = "rgba(143,255,107,.08)";
            context.beginPath();
            context.moveTo(0, y);
            context.lineTo(rect.width, y);
            context.stroke();
          }

          context.save();
          context.translate(state.gem.x, state.gem.y);
          context.rotate(performance.now() / 600);
          context.fillStyle = "#ffd35b";
          context.shadowColor = "#ffd35b";
          context.shadowBlur = 18;
          context.beginPath();
          context.moveTo(0, -state.gem.radius);
          context.lineTo(state.gem.radius, 0);
          context.lineTo(0, state.gem.radius);
          context.lineTo(-state.gem.radius, 0);
          context.closePath();
          context.fill();
          context.restore();

          context.beginPath();
          context.arc(state.player.x, state.player.y, state.player.radius, 0, Math.PI * 2);
          context.fillStyle = "#8fff6b";
          context.shadowColor = "#8fff6b";
          context.shadowBlur = 20;
          context.fill();
          context.shadowBlur = 0;
          context.strokeStyle = "#effff1";
          context.lineWidth = 4;
          context.stroke();
        };

        const input = new InputManager();
        state.removeInput = input.attach(area, {
          down: ({ x, y }) => {
            const rect = area.getBoundingClientRect();
            state.player.tx = x * rect.width;
            state.player.ty = y * rect.height;
          },
          move: ({ x, y }) => {
            const rect = area.getBoundingClientRect();
            state.player.tx = x * rect.width;
            state.player.ty = y * rect.height;
          }
        });

        const loop = (now) => {
          const rect = area.getBoundingClientRect();
          const remaining = Math.max(0, state.duration - (now - state.started));

          state.player.x += (state.player.tx - state.player.x) * 0.16;
          state.player.y += (state.player.ty - state.player.y) * 0.16;

          state.player.x = Math.max(state.player.radius, Math.min(rect.width - state.player.radius, state.player.x));
          state.player.y = Math.max(state.player.radius, Math.min(rect.height - state.player.radius, state.player.y));

          if (Math.hypot(state.player.x - state.gem.x, state.player.y - state.gem.y) < state.player.radius + state.gem.radius) {
            state.score += 1;
            spawnGem();
            this.audio.play("point");
            this.audio.vibrate(10);
          }

          const hud = document.querySelector("#hudValue");
          if (hud) hud.textContent = `${Math.ceil(remaining / 1000)}s • ${state.score} gems`;

          draw();

          if (remaining <= 0) {
            this.storage.controllerRecord(state.score);
            this.storage.win();
            this.audio.play("win");
            this.stop();
            this.ui.results(
              "TEST ARENA COMPLETE",
              `Best local score: ${this.storage.data.stats.controllerArenaHigh} gems.`,
              [{ name: "Player 1", score: `${state.score} gems` }],
              () => this.startControllerArena()
            );
            return;
          }

          state.frame = requestAnimationFrame(loop);
        };

        resize();
        window.addEventListener("resize", resize);
        state.frame = requestAnimationFrame(loop);

        this.cleanup = () => {
          cancelAnimationFrame(state.frame);
          state.removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }
    }

    class App {
      constructor() {
        this.app = document.querySelector("#app");
        this.storage = new StorageManager();
        this.audio = new AudioManager(this.storage);
        this.gameManager = new GameManager(this.storage, this.audio);
        this.network = new NetworkManager(null);
        this.ui = new UIManager(this.app, this.storage, this.audio, this.network, this.gameManager);

        this.network.ui = this.ui;
        this.gameManager.ui = this.ui;

        document.addEventListener("contextmenu", event => event.preventDefault());
        document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });

        this.registerServiceWorker();
        this.ui.home();
      }

      registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js").catch(() => {
              /* The app remains usable if service worker registration fails. */
            });
          });
        }
      }
    }

    new App();
  </script>
</body>
